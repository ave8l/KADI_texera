<div id="search-box">
  <input
    [placeholder]="semanticEnabled ? 'describe what you want to do' : 'search operator'"
    nz-input
    [(ngModel)]="searchInputValue"
    (input)="onInput($event)"
    [nzAutocomplete]="autocomplete" />
  <nz-autocomplete
    #autocomplete
    [nzBackfill]="false"
    (selectionChange)="onSelectionChange($event)">
    <nz-auto-option
      *ngFor="let option of autocompleteOptions"
      class="suggestion"
      [nzValue]="option"
      [nzLabel]="option.additionalMetadata.userFriendlyName"
      [nzDisabled]="! canModify">
      <div class="suggestion-head">
        <texera-operator-label [operator]="option"></texera-operator-label>
        <span
          *ngIf="scoreLabel(option) as score"
          class="semantic-score"
          title="relevance">
          {{ score }}
        </span>
      </div>
      <div
        *ngIf="option.additionalMetadata.operatorDescription as description"
        class="suggestion-description">
        {{ description }}
      </div>
    </nz-auto-option>
  </nz-autocomplete>

  <div class="semantic-toggle">
    <nz-switch
      nzSize="small"
      [(ngModel)]="semanticEnabled"
      (ngModelChange)="onSemanticToggle()"></nz-switch>
    <span class="semantic-toggle-label">search by meaning</span>
    <span
      *ngIf="semanticLoading"
      class="semantic-toggle-status"
      >loading model…</span
    >
  </div>

  <!-- The keyword search only matches operator names, so a query phrased as an
       intent comes back empty. Say what happened and offer the way out. -->
  <button
    *ngIf="showSemanticSuggestion"
    type="button"
    class="semantic-suggestion"
    (click)="enableSemanticSearch()">
    No results. Try <strong>search by meaning</strong>
  </button>
</div>

<div id="spacer"></div>

<!-- What usually comes after the operator the canvas has selected. Clicking one
     places it and wires it, which is the whole point: no search in between. -->
<div
  class="next-step"
  *ngIf="nextSuggestions.length || nextStepNote">
  <div class="next-step__title">After {{ selectedOperatorName }}</div>
  <button
    *ngFor="let suggestion of nextSuggestions"
    type="button"
    class="next-step__option"
    [disabled]="!canModify"
    [title]="suggestion.additionalMetadata.operatorDescription || ''"
    (click)="addNext(suggestion)">
    <span class="next-step__plus">+</span>
    {{ suggestion.additionalMetadata.userFriendlyName }}
  </button>
  <div
    class="next-step__note"
    *ngIf="nextStepNote">
    {{ nextStepNote }}
  </div>
</div>

<ng-container *ngTemplateOutlet="menuTemplate; context: { $implicit: groupNames, depth: 0 }"></ng-container>

<ng-template
  #menuTemplate
  let-groupNames
  let-depth="depth">
  <nz-collapse
    nzBordered="false"
    nzExpandIconPosition="end"
    nzAccordion>
    <nz-collapse-panel
      *ngFor="let groupname of groupNames"
      [nzHeader]="groupname.groupName"
      class="operator-group"
      [attr.data-depth]="depth">
      <div class="indent">
        <ng-container
          *ngTemplateOutlet="menuTemplate; context: { $implicit: groupname.children, depth: depth + 1 }"></ng-container>
        <div
          *ngFor="let operatorSchema of opList.get(groupname.groupName)"
          class="operator-label">
          <texera-operator-label [operator]="operatorSchema"></texera-operator-label>
        </div>
      </div>
    </nz-collapse-panel>
  </nz-collapse>
</ng-template>
